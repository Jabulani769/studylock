composeCompiler = "1.5.11"
lifecycle = "2.8.3"
navigationCompose = "2.7.7"
datastore = "1.1.1"
ksp = "1.9.23-1.0.20"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
